name: Eval (nightly, live)

# The every-commit gate (ci.yml) runs the deterministic evals with no keys.
# This job runs the LIVE evals — Ragas faithfulness, the calibrated LLM-judge,
# and the full contradiction recall + before/after-Critic precision — which need
# an API key and the heavier eval extra. It runs nightly and on demand.
#
# This is also where the "bad-prompt PR fails CI" demo artifact lives: point a PR
# at this workflow (workflow_dispatch) with a prompt change that drops faithfulness
# or recall below evals/thresholds.yaml -> the job goes red. Keep the run link.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

env:
  UV_FROZEN: "1"

jobs:
  live-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (runtime + dev + eval)
        run: uv sync --group dev --group eval

      - name: Live eval gate (Ragas + judge + full audit)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest -m eval
