# Eval-gate thresholds. Two tiers:
#   gate  — deterministic, enforced on EVERY commit in CI (no API keys).
#   live  — Ragas / judge / full-pipeline, enforced only in the nightly/live job.
# Tuning a number here is a reviewable config change, not an edit to test logic.

gate:
  retrieval:
    k: 5
    # Observed on the seeded corpus: P@5 ~0.31 (ceiling is low — most questions
    # have 1-2 expected sources), R@5 ~0.93. Floors keep headroom for benign
    # changes while catching a real retrieval regression.
    precision_at_k: 0.25
    recall_at_k: 0.85
  # Deterministic detectors recover the numeric + superseded true conflicts with
  # no LLM (10 guaranteed; C06 is a bonus). Below this => a rule regression.
  deterministic_recall_min: 10

live:
  generation:
    faithfulness_min: 0.85
    answer_relevancy_min: 0.80
    context_precision_min: 0.70
  contradiction:
    # Full pipeline incl. the LLM comparator. Since rule candidates bypass the
    # Critic (they are high-precision by construction), the first live run
    # recovered 15/15; this floor keeps headroom for gpt-4o-mini variance.
    full_recall_min: 11
    # Precision after the Critic filters the comparator's false positives.
    # Measured ~0.79 on the first live run (15 true / 4 spurious, zero designated
    # near-misses). The Critic is a non-deterministic gpt-4o-mini judge, so the
    # floor sits below the measured mean to be a reliable guard against a real
    # collapse rather than a coin-flip — consistent with the 0.70 judge floors.
    critic_precision_min: 0.75
  judge:
    precision_min: 0.70
    recall_min: 0.70
