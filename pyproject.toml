[project]
name = "requirements-audit"
version = "0.1.0"
description = "Multi-agent contradiction detection over engineering requirement documents, with a measured eval harness."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sabin Bobu", email = "bobu8sabin8@gmail.com" }]
keywords = ["llm", "agents", "rag", "evaluation", "requirements", "pydantic-ai"]

dependencies = [
    "pydantic>=2.9",
    "pydantic-ai>=0.0.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "qdrant-client>=1.12",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pypdf>=5.0",  # text-based PDF ingestion
    "python-multipart>=0.0.9",  # FastAPI UploadFile (the /upload endpoint)
]

[project.scripts]
requirements-audit = "requirements_audit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "fpdf2>=2.8",  # renders PDF fixtures for the PDF-ingestion tests
]
# Evaluation stack is heavier (pulls a large transitive tree); kept separate so
# the core dev loop stays fast. Install with: uv sync --group eval
eval = [
    "ragas>=0.2",
    "langfuse>=2.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/requirements_audit"]

# ─── Ruff: linter + formatter (replaces black, isort, flake8) ──────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"evals/*" = ["B011"]

[tool.ruff.lint.flake8-bugbear]
# Typer's function-call defaults (Argument/Option) are the intended idiom.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
docstring-code-format = true

# ─── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "evals"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "eval: marks a test as part of the evaluation gate (deselect with '-m \"not eval\"')",
    "slow: marks a test as slow (deselect with '-m \"not slow\"')",
]

# ─── mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
files = ["src", "tests", "evals"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "ragas.*", "langfuse.*"]
ignore_missing_imports = true
